apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: refound
  namespace: refound
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: refound.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: refound
                port: { number: 80 }