apiVersion: apps/v1
kind: Deployment
metadata:
  name: refound
  namespace: refound
  labels: { app: refound }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: refound }
  template:
    metadata:
      labels: { app: refound }
    spec:
      securityContext:
        runAsUser: 10001
        runAsNonRoot: true
        fsGroup: 10001
      containers:
        - name: refound
          image: ghcr.io/haneenmohammed22/refound:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          envFrom:
            - configMapRef: { name: refound-config }
            - secretRef:    { name: refound-secret }
          volumeMounts:
            - name: data
              mountPath: /app/instance
          readinessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 5000 }
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: refound-data