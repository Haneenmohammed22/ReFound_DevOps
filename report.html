<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReFound | Report</title><link rel="icon" href="assets/refound-logo.png"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="v10.css?v=10.2">
<link rel="stylesheet" href="v11.css?v=11.0"></head><body class="auth-page"><header class="auth-top"><div class="container"><a class="auth-logo" href="index.html"><img src="assets/refound-logo.png" alt="ReFound official logo"></a><div class="auth-top-actions"><button class="lang-btn" id="langBtn">🌐 <span id="langText">EN</span></button><a class="auth-back" href="reports.html" id="browseLink">البلاغات</a><a class="auth-back" href="claims.html" id="claimsLink">الرسائل والطلبات</a><a class="auth-back" href="dashboard.html" id="myLink">حسابي</a></div></div></header><main class="container phase-main narrow"><div class="phase-heading"><div><span class="auth-kicker">ReFound · Reports</span><h1 id="title">أضف بلاغ</h1><p id="subtitle">اكتب بيانات واضحة تساعد في العثور على الغرض.</p></div></div><div id="detail" class="auth-card" hidden></div><form id="form" class="auth-card report-form" enctype="multipart/form-data"><div class="field"><label id="kindLabel" for="kind">نوع البلاغ</label><select id="kind" name="kind" required><option value="lost">مفقود</option><option value="found">موجود</option></select></div><div class="field"><label id="titleLabel" for="itemTitle">اسم الغرض</label><input id="itemTitle" name="title" required maxlength="100"></div><div class="field"><label id="categoryLabel" for="category">التصنيف</label><select id="category" name="category"><option value="Electronics">Electronics</option><option value="Documents">Documents</option><option value="Keys">Keys</option><option value="Bags">Bags</option><option value="Clothes">Clothes</option><option value="Other">Other</option></select></div><div class="field"><label id="colorLabel" for="color">اللون</label><input id="color" name="color" required maxlength="50"></div><div class="field"><label id="locationLabel" for="place">المكان</label><input id="place" name="location" required maxlength="120"></div><div class="field"><label id="dateLabel" for="eventDate">التاريخ</label><input id="eventDate" name="event_date" type="date" required></div><div class="field"><label id="descriptionLabel" for="description">الوصف</label><textarea id="description" name="description" required maxlength="2000" rows="5"></textarea></div><div class="field"><label id="imageLabel" for="image">الصورة (اختياري - 5MB)</label><input id="image" name="image" type="file" accept="image/png,image/jpeg,image/webp"></div><p class="small-privacy" id="privacy">ما تكتبيش بيانات شخصية أو علامات ملكية سرية في الوصف العام.</p><p id="status" class="auth-status" role="status" hidden></p><button class="button primary" id="submitBtn" type="submit">نشر البلاغ</button></form></main><script src="report.js"></script><script src="shared-nav.js?v=10.2"></script></body></html>
