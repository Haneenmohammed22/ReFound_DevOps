name: ReFound CI/CD

on:
  push:
    branches: [main]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/refound

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest -v test_matching.py test_security.py
      - run: python evaluate_matching.py

  lint-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  build-scan-push:
    needs: [test, lint-dockerfile]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.set-image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase GHCR image tag
        id: set-image
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "image_tag=ghcr.io/${OWNER_LOWER}/refound:${{ github.sha }}" >> "$GITHUB_OUTPUT"
          echo "IMAGE_BASE=ghcr.io/${OWNER_LOWER}/refound" >> "$GITHUB_ENV"

      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: refound:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: refound:scan
          severity: CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      - name: Push image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}:${{ github.sha }}
            ${{ env.IMAGE_BASE }}:latest
          cache-from: type=gha

  deploy:
    needs: build-scan-push
    if: github.event_name == 'push'
    runs-on: self-hosted
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy with Kustomize
        shell: bash
        run: |
          cd k8s
          kustomize edit set image ghcr.io/haneenmohammed22/refound=${{ needs.build-scan-push.outputs.image_tag }}
          kubectl apply -k .
          kubectl -n refound rollout status deployment/refound --timeout=180s